{% extends "base.html" %}
{% block content %}
<h1>Farmer Registration</h1>
<form class="stack" method="post">
  <label>Full name <input name="name" required></label>
  <label>Your nearest town
    <select name="village" required>{% for t in towns %}<option>{{ t }}</option>{% endfor %}</select></label>
  <label>Phone (10 digits) <input name="phone" type="tel" inputmode="numeric" pattern="[0-9]{10}" required></label>
  <label>Password (min 6 characters) <input name="password" type="password" minlength="6" required></label>
  <button type="submit">Create account</button>
</form>
{% endblock %}
